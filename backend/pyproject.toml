[project]
name = "pupa-backend"
version = "0.0.85"
description = "Pupa A2UI agent backend"
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Pupa", email = "support@pupa-app.com" }]
keywords = ["ag-ui", "langgraph", "agent", "fastapi", "llm"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
]
dependencies = [
    "fastapi>=0.110.0",
    "pyyaml>=6.0",
    "uvicorn[standard]>=0.30.0",
    "langgraph>=1.0.0",
    "langchain>=1.3.14",
    "langchain-aws>=0.2.0",
    "langchain-anthropic>=0.3.0",
    "langchain-openai>=0.3.0",
    "copilotkit>=0.1.88",
    "ag-ui-langgraph>=0.0.42",
    "boto3>=1.34.0",
    "langgraph-checkpoint-sqlite>=2.0.0",
    "langgraph-checkpoint-postgres>=2.0.0",
    "psycopg[binary,pool]>=3.3.4",
    "langchain-tavily>=0.1.0",
    "langfuse>=3.0.0,<4.0.0",
    "deepagents>=0.6.0",
    "qrcode>=8.0.0",
    # MCP client plumbing for the config-driven `mcp_servers:` block
    # (backend/mcp_servers.py). Shipped by default — not optional — so every
    # install resolves FastMCP 3.x. The `>=0.2.2` floor keeps the resolver off
    # the old 0.1.x adapters that drag in FastMCP 2.x. Playwright is the same
    # plumbing; it only additionally needs browser binaries via
    # `npx --yes playwright install chromium` (see `make install-playwright`).
    "langchain-mcp-adapters>=0.2.2",
    "fastmcp>=3.4.2",
    "claude-agent-sdk>=0.2.106",
]

[project.optional-dependencies]
setup = [
    "cryptography>=49.0.0",
    "pyyaml>=6.0",
]
dev = [
    "pytest>=9.1.1",
    "pytest-asyncio>=0.23.0",
]

[project.urls]
Homepage = "https://github.com/pupa-app/pupa-backend"
Repository = "https://github.com/pupa-app/pupa-backend"
Changelog = "https://github.com/pupa-app/pupa-backend/blob/main/CHANGELOG.md"
Issues = "https://github.com/pupa-app/pupa-backend/issues"

[project.scripts]
pupa-backend = "pupa_backend.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["pupa_backend"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
