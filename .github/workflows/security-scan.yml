name: Security scan

# Dependency vulnerabilities + leaked secrets, on every PR and on the release
# branches. Deliberately NOT path-filtered like backend-tests.yml: a lockfile
# is only one of the ways a vulnerability arrives, and a leaked secret can land
# in any file in the repo.
#
# Neither job is a required check (repo settings) — advisories appear and
# disappear without any change on our side, so a red scan is a signal to
# triage, not a merge block. That is why there is no `continue-on-error` here:
# GitHub reports a continue-on-error job as *passing*, so a new CVE or a leaked
# key would show a green tick and the scan would signal nothing at all.
on:
  push:
    branches: [main, dev]
  pull_request:
  schedule:
    # Weekly, so a newly-published advisory against an unchanged lockfile still
    # surfaces. Monday 06:00 UTC.
    - cron: "0 6 * * 1"

concurrency:
  group: security-scan-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  pip-audit:
    name: pip-audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"

      # Audit the resolved lockfile, not the `>=` floors in pyproject.toml —
      # uv.lock is what actually gets installed.
      - name: Export locked requirements
        working-directory: backend
        run: uv export --frozen --no-emit-project --format requirements-txt > /tmp/requirements.txt

      # --no-deps: the export is already the fully-resolved set, so there is
      # nothing left to resolve and pip-audit shouldn't build a venv to do it.
      - name: Audit
        run: |
          uvx pip-audit --requirement /tmp/requirements.txt --no-deps --strict --progress-spinner off

  secret-scan:
    name: secret scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          # Full history so a secret committed earlier in the branch is caught
          # too, not just the tip.
          fetch-depth: 0

      # The container, not gitleaks-action@v2: that action requires a paid
      # GITLEAKS_LICENSE secret for organization-owned repos and exits non-zero
      # without one, which would make every run red for a reason unrelated to
      # secrets. Exit code 1 = findings.
      # The container runs as root while the checkout is owned by the runner
      # user, so git refuses the repo ("dubious ownership") before gitleaks
      # reads a single commit — and with continue-on-error gone that failure is
      # a red check, not a silent one. GIT_CONFIG_* is the documented way in.
      - name: gitleaks
        run: |
          docker run --rm -v "$PWD:/repo" \
            -e GIT_CONFIG_COUNT=1 \
            -e GIT_CONFIG_KEY_0=safe.directory \
            -e GIT_CONFIG_VALUE_0=/repo \
            ghcr.io/gitleaks/gitleaks:v8.18.4 \
            detect --source=/repo --redact --no-banner
