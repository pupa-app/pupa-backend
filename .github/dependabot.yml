# Dependabot keeps dependencies and pinned action versions up to date.
# Docs: https://docs.github.com/code-security/dependabot/dependabot-version-updates
version: 2
updates:
  # Python backend (uv-managed; updates pyproject.toml + uv.lock).
  - package-ecosystem: "uv"
    directory: "/backend"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    open-pull-requests-limit: 5
    commit-message:
      prefix: "chore(deps)"

  # GitHub Actions used by the workflows.
  - package-ecosystem: "github-actions"
    directory: "/"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(ci)"

  # Swift screen-share sidecar (SwiftPM).
  - package-ecosystem: "swift"
    directory: "/screenshare-sidecar"
    target-branch: "dev"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "chore(deps)"
